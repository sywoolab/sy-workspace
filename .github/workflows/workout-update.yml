name: workout-update

on:
  push:
    paths:
      - 'workout/workout_log.json'
  workflow_dispatch:

# HTML 생성·training-dashboard repo 배포는 dashboard-update.yml에서 담당.
# 읽기 전용 최신 스냅샷 검증. 알림은 홈페이지 배포 후 dashboard-update.yml에서 전송한다.

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run workout analysis
        env:
          BOT_TOKEN: ${{ secrets.TRAINING_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python workout/scripts/workout_analysis.py --dry-run
